<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pentru Tine ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffe6ea 0%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Floating Hearts Animation */
        .heart-bg {
            position: absolute;
            top: -10vh;
            color: #ff8fab;
            font-size: 20px;
            opacity: 0.6;
            animation: fall linear infinite;
            z-index: 0;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(255, 143, 171, 0.5);
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 8px 32px 0 rgba(255, 143, 171, 0.2);
            text-align: center;
            max-width: 450px;
            width: 90%;
            position: relative;
            z-index: 10;
            transition: all 0.5s ease;
        }

        /* Typography */
        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            color: #d81b60;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(216, 27, 96, 0.15);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #880e4f;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* Envelop / Steps Logic */
        .step {
            display: none;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .step.active {
            display: block;
            opacity: 1;
        }

        /* Buttons */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 60px;
        }

        button {
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn-yes, .activity-btn, .confirm-btn {
            background: linear-gradient(45deg, #ff8fab, #fb6f92);
            color: white;
        }

        .btn-yes:hover, .activity-btn:hover, .confirm-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(251, 111, 146, 0.4);
        }

        .btn-no {
            background: white;
            color: #d81b60;
            position: absolute; /* Needed for teleportation */
        }

        /* Activities Grid */
        .activities-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .activity-btn {
            padding: 15px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.8);
            color: #d81b60;
            border: 2px solid #ff8fab;
        }
        .activity-btn:hover {
            background: linear-gradient(45deg, #ff8fab, #fb6f92);
            color: white;
        }

        /* Calendar */
        .calendar-wrapper {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 15px;
        }
        
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            color: #d81b60;
            font-weight: 600;
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .day-name {
            font-size: 0.8rem;
            color: #ff8fab;
            font-weight: 600;
        }

        .calendar-day {
            padding: 8px 0;
            font-size: 0.9rem;
            color: #880e4f;
            cursor: pointer;
            border-radius: 50%;
            transition: 0.3s;
        }

        .calendar-day:hover:not(.empty) {
            background: #ffb3c6;
        }

        .calendar-day.selected {
            background: #d81b60;
            color: white;
            box-shadow: 0 4px 10px rgba(216, 27, 96, 0.3);
        }

        .calendar-day.empty {
            cursor: default;
        }

        /* Time Picker */
        .time-container {
            margin-top: 20px;
            margin-bottom: 20px;
        }
        
        input[type="time"] {
            border: 2px solid #ff8fab;
            border-radius: 15px;
            padding: 10px 15px;
            font-size: 1.1rem;
            color: #d81b60;
            font-family: 'Poppins', sans-serif;
            background: white;
            outline: none;
        }

        /* Confetti Canvas */
        #confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }

        .heart-icon {
            font-size: 40px;
            margin-bottom: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        
        .summary-text {
            font-size: 1.1rem;
            color: #880e4f;
            margin: 10px 0;
            padding: 15px;
            background: rgba(255,255,255,0.7);
            border-radius: 15px;
            text-align: left;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <canvas id="confetti"></canvas>

    <div class="glass-card">
        
        <!-- STEP 1: The Question -->
        <div id="step-1" class="step active">
            <div class="heart-icon">💖</div>
            <h1 class="title">Hei Frumoaso...</h1>
            <p class="subtitle">Vrei să ieși cu mine la o întâlnire?</p>
            
            <div class="btn-container" id="btn-container">
                <button class="btn-yes" onclick="goToStep2()">DA</button>
                <button class="btn-no" id="btn-no">NU</button>
            </div>
        </div>

        <!-- STEP 2: Activity Selection -->
        <div id="step-2" class="step">
            <h1 class="title" style="font-size: 2.8rem;">Am știut! 🥰</h1>
            <p class="subtitle">Acum că ai deschis plicul...<br>Ce ai vrea să facem?</p>
            
            <div class="activities-grid">
                <button class="activity-btn" onclick="selectActivity('🎬 Film')">🎬 Film</button>
                <button class="activity-btn" onclick="selectActivity('🚶‍♀️ Plimbare')">🚶‍♀️ Plimbare</button>
                <button class="activity-btn" onclick="selectActivity('✨ Alte activități')">✨ Alte activități</button>
            </div>
        </div>

        <!-- STEP 3: Date & Time Selection -->
        <div id="step-3" class="step">
            <h1 class="title" style="font-size: 2.5rem;">Când ne vedem?</h1>
            
            <div class="calendar-wrapper">
                <div class="calendar-header">
                    <span id="month-year"></span>
                </div>
                <div class="calendar-grid" id="calendar-grid">
                    <!-- Days injected via JS -->
                </div>
            </div>

            <div class="time-container">
                <input type="time" id="time-picker" value="19:00">
            </div>

            <button class="confirm-btn" onclick="goToStep4()">Confirmă Data ❤️</button>
        </div>

        <!-- STEP 4: Final Success -->
        <div id="step-4" class="step">
            <div class="heart-icon">🌹</div>
            <h1 class="title" style="font-size: 3rem;">Perfect!</h1>
            <p class="subtitle">Iată detaliile întâlnirii noastre:</p>
            
            <div class="summary-text">
                📍 <b>Activitate:</b> <span id="summary-activity"></span><br>
                🗓️ <b>Data:</b> <span id="summary-date"></span><br>
                ⏰ <b>Ora:</b> <span id="summary-time"></span>
            </div>
            
            <p style="margin-top: 20px; font-weight: 600; color: #d81b60;">Fă un screenshot și trimite-mi-l! Abia aștept! 🥰</p>
        </div>

    </div>

    <script>
        /* --- Background Floating Hearts --- */
        function createHearts() {
            const hearts = ["❤️", "💖", "💕", "🌸", "✨"];
            setInterval(() => {
                const heart = document.createElement("div");
                heart.classList.add("heart-bg");
                heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.animationDuration = Math.random() * 3 + 4 + "s";
                heart.style.fontSize = Math.random() * 15 + 10 + "px";
                document.body.appendChild(heart);
                setTimeout(() => { heart.remove(); }, 7000);
            }, 300);
        }
        createHearts();

        /* --- Teleporting NO Button --- */
        const btnNo = document.getElementById('btn-no');
        const container = document.getElementById('btn-container');

        // Set absolute position based on normal layout to avoid jumping before hover
        setTimeout(() => {
            const rect = btnNo.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            btnNo.style.right = "0px"; 
            btnNo.style.top = "0px";
        }, 100);

        function teleportButton() {
            // Get viewport dimensions
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            // Get button dimensions
            const btnWidth = btnNo.offsetWidth;
            const btnHeight = btnNo.offsetHeight;
            
            // Calculate random positions (ensuring it stays within screen bounds)
            const randomX = Math.random() * (windowWidth - btnWidth - 40);
            const randomY = Math.random() * (windowHeight - btnHeight - 40);
            
            // Move button to body level for true viewport teleportation
            btnNo.style.position = 'fixed';
            btnNo.style.left = `${randomX}px`;
            btnNo.style.top = `${randomY}px`;
            
            // Micro-interaction: shrink slightly
            let currentScale = parseFloat(btnNo.style.transform.replace('scale(', '').replace(')', '')) || 1;
            if(currentScale > 0.6) {
                btnNo.style.transform = `scale(${currentScale - 0.05})`;
            }
        }

        btnNo.addEventListener('mouseover', teleportButton);
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault();
            teleportButton();
        });

        /* --- Global State --- */
        let selectedActivity = "";
        let selectedDate = "";
        let selectedTime = "";

        /* --- Step Transitions --- */
        function switchStep(fromId, toId) {
            const fromEl = document.getElementById(fromId);
            const toEl = document.getElementById(toId);
            fromEl.classList.remove('active');
            setTimeout(() => {
                fromEl.style.display = 'none';
                toEl.style.display = 'block';
                setTimeout(() => { toEl.classList.add('active'); }, 50);
            }, 600);
        }

        function goToStep2() {
            triggerConfetti();
            btnNo.style.display = 'none'; // hide the wandering button permanently
            switchStep('step-1', 'step-2');
        }

        function selectActivity(activity) {
            selectedActivity = activity;
            renderCalendar();
            switchStep('step-2', 'step-3');
        }

        function goToStep4() {
            selectedTime = document.getElementById('time-picker').value;
            if(!selectedDate) {
                alert("Te rog, alege o zi din calendar! ❤️");
                return;
            }
            
            document.getElementById('summary-activity').innerText = selectedActivity;
            document.getElementById('summary-date').innerText = selectedDate;
            document.getElementById('summary-time').innerText = selectedTime;
            
            triggerConfetti();
            switchStep('step-3', 'step-4');
        }

        /* --- Calendar Logic --- */
        const monthNames = ["Ianuarie", "Februarie", "Martie", "Aprilie", "Mai", "Iunie", "Iulie", "August", "Septembrie", "Octombrie", "Noiembrie", "Decembrie"];
        let currentDate = new Date();

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const monthYearText = document.getElementById('month-year');
            
            const month = currentDate.getMonth();
            const year = currentDate.getFullYear();
            
            monthYearText.innerText = `${monthNames[month]} ${year}`;
            grid.innerHTML = '';

            // Add day names
            const days = ['Lu', 'Ma', 'Mi', 'Jo', 'Vi', 'Sâ', 'Du'];
            days.forEach(day => {
                const dayEl = document.createElement('div');
                dayEl.classList.add('day-name');
                dayEl.innerText = day;
                grid.appendChild(dayEl);
            });

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            // Adjust first day (Monday = 0, Sunday = 6)
            let startDay = firstDay === 0 ? 6 : firstDay - 1;

            // Empty slots
            for (let i = 0; i < startDay; i++) {
                const empty = document.createElement('div');
                empty.classList.add('calendar-day', 'empty');
                grid.appendChild(empty);
            }

            // Days
            for (let i = 1; i <= daysInMonth; i++) {
                const dayBtn = document.createElement('div');
                dayBtn.classList.add('calendar-day');
                dayBtn.innerText = i;
                
                dayBtn.onclick = function() {
                    document.querySelectorAll('.calendar-day').forEach(d => d.classList.remove('selected'));
                    dayBtn.classList.add('selected');
                    selectedDate = `${i} ${monthNames[month]} ${year}`;
                };
                
                grid.appendChild(dayBtn);
            }
        }

        /* --- Confetti Logic --- */
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        const colors = ['#ff8fab', '#fb6f92', '#ffb3c6', '#ffc2d1', '#ffffff'];

        function triggerConfetti() {
            particles = [];
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2 + 100,
                    r: Math.random() * 6 + 2,
                    dx: Math.random() * 10 - 5,
                    dy: Math.random() * -10 - 5,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            requestAnimationFrame(animateConfetti);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                p.x += p.dx;
                p.y += p.dy;
                p.dy += 0.2; // gravity
                if (p.y > canvas.height) particles.splice(index, 1);
            });
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
